<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Halaman tidak ditemukan | Need Learning Organizer</title>
<link rel="icon" type="image/png" href="/nlo-website/img/logo-mark.png">
<link rel="preload" href="/nlo-website/assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Plus Jakarta Sans"; font-style: normal; font-display: swap; font-weight: 200 800;
  src: url("/nlo-website/assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root { --ink: #06141c; --deep: #0b2a36; --glow: #3fd0e0; --mist: #9fc4cc; --line2: rgba(159,196,204,.3); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); }
body { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #d9e8ec; text-align: center;
  background: radial-gradient(closest-side at 70% 20%, rgba(20,163,184,.22), transparent 70%), var(--ink); }
main { max-width: 520px; }
img { height: 44px; width: auto; margin: 0 auto 32px; display: block; }
.code { font-size: clamp(4rem, 16vw, 7rem); font-weight: 800; line-height: 1; color: var(--glow); letter-spacing: -0.04em; }
h1 { font-size: clamp(1.5rem, 5vw, 2rem); color: #fff; margin: 16px 0 10px; letter-spacing: -0.01em; }
p { color: var(--mist); margin: 0 0 30px; line-height: 1.7; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
a.btn { display: inline-flex; padding: 13px 24px; border-radius: 999px; font-weight: 700; text-decoration: none; }
.solid { background: var(--glow); color: var(--ink); }
.ghost { border: 1px solid var(--line2); color: #fff; }
a.btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/nlo-website/img/logo-mark.webp" width="64" height="38" alt="Need Learning Organizer">
  <div class="code" aria-hidden="true">404</div>
  <h1>Halaman ini tidak ditemukan.</h1>
  <p>Alamatnya mungkin salah ketik atau halamannya sudah dipindah. Silakan lanjut dari salah satu halaman berikut.</p>
  <div class="actions">
    <a class="btn solid" href="/nlo-website/">Ke beranda</a>
    <a class="btn ghost" href="/nlo-website/gathering/">Lihat The Art of Gathering</a>
  </div>
</main>
</body>
</html>
